
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Expense Tracker</h1>
            <p>Manage your money. Track your spending.</p>
        </header>

        <section class="budget-section">
            <h2>Set Your Budget</h2>
            <div class="budget-input">
                <input type="number" id="budget" placeholder="Enter your budget" min="0">
                <button id="setBudgetBtn">Set Budget</button>
            </div>
        </section>

        <section class="summary">
            <div class="summary-card">
                <h3>Total Budget</h3>
                <p id="totalBudget">₹0</p>
            </div>

            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p id="totalExpenses">₹0</p>
            </div>

            <div class="summary-card">
                <h3>Remaining Balance</h3>
                <p id="remainingBalance">₹0</p>
            </div>
        </section>

        <section class="expense-section">
            <h2>Add New Expense</h2>

            <form id="expenseForm">
                <input
                    type="text"
                    id="expenseName"
                    placeholder="Expense name"
                    required
                >

                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Amount (₹)"
                    min="0.01"
                    step="0.01"
                    required
                >

                <select id="expenseCategory" required>
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Expense History</h2>

            <div class="expense-list" id="expenseList">
                <p class="empty-message">No expenses added yet.</p>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
